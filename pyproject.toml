[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dietrich"
version = "0.4.0a5"
description = "Dietrich: the office picklock. Soft unlock and open-password recovery for Excel, Word, PowerPoint, and PDF (authorized documents)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Sebastian Spicker" },
]
keywords = [
  "dietrich",
  "picklock",
  "excel",
  "xlsx",
  "docx",
  "pptx",
  "pdf",
  "ooxml",
  "password",
  "unlock",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = ["defusedxml>=0.7.1"]

[project.optional-dependencies]
crypto = ["msoffcrypto-tool>=5.0.0"]
pdf = ["pikepdf>=8.0.0"]
legacy = ["olefile>=0.46"]
sign = ["cryptography>=42.0.0", "lxml>=5.0.0"]
ui = ["textual>=1.0.0"]
full = [
  "msoffcrypto-tool>=5.0.0",
  "pikepdf>=8.0.0",
  "olefile>=0.46",
  "cryptography>=42.0.0",
  "lxml>=5.0.0",
  "textual>=1.0.0",
]
dev = ["pyright>=1.1.390", "pytest>=8.0.0", "ruff>=0.6.0"]

[dependency-groups]
demo = ["playwright>=1.50.0"]

[project.scripts]
dietrich = "dietrich.cli:main"
dietrich-tui = "dietrich.tui:main"
dietrich-gui = "dietrich.gui:main"
dietrich-research = "dietrich.research:main"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/examples", "/assets/brand",
  "/site/index.html", "/site/styles.css", "/site/script.js",
  "/site/README.md", "/site/screenshots", "/site/tests", "/scripts",
  "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md",
  "/SECURITY.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/captures", "**/test-results"]

[tool.hatch.build.targets.wheel]
packages = ["src/dietrich"]

# Map the src-layout package to its importable top-level name in wheel installs.
# Non-.py package data (the tui/styles/*.tcss stylesheets and gui/assets/*) is
# carried automatically by the packages glob above; scripts/check_distributions.py
# asserts the exact expected asset set in both built artifacts.
[tool.hatch.build.targets.wheel.sources]
"src/dietrich" = "dietrich"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
