<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Dietrich - the office picklock">
  <!--
    Dark Werkbank social / repo card.
    Night slate canvas, Paper gray mark + wordmark, Filing tagline, Stamp blue plaque line.
  -->
  <rect width="1280" height="640" fill="#12161C"/>
  <rect x="64" y="64" width="1152" height="512" rx="8" fill="#1B222C" stroke="#3A4656" stroke-width="1"/>

  <!-- Picklock mark (scaled, Paper gray) -->
  <g
    transform="translate(140 200) scale(4.2)"
    fill="none"
    stroke="#D7DDE6"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M25 24c-10.5 0-16 3.6-16 8s5.5 8 16 8"/>
    <path d="M23 32h30l9 2.4"/>
  </g>

  <!-- Wordmark -->
  <text
    x="460"
    y="300"
    fill="#D7DDE6"
    font-family="'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="96"
    font-weight="600"
    letter-spacing="-0.02em"
  >Dietrich</text>

  <!-- Frozen tagline -->
  <text
    x="460"
    y="360"
    fill="#8B97A8"
    font-family="'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="32"
    font-weight="400"
    letter-spacing="0.02em"
  >the office picklock</text>

  <!-- Quiet authorized-use line (Stamp blue plaque authority) -->
  <text
    x="460"
    y="430"
    fill="#4F7CAC"
    font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="20"
    font-weight="400"
  >Authorized use only - soft locks and open passwords on files you own.</text>
</svg>
